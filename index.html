    <meta name="theme-color" content="#131211" />
    <script>
      /* Pre-paint theme: an explicit stored choice wins; dark is the default
         (no system-preference sniffing). Runs before any CSS so the first
         frame is already dark — no flash either way. */
      try {
        var theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#131211' : '#f2f1ee';
      } catch (e) {}
    </script>
